[project]
name = "auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi-mail>=1.4.1",
    "fastapi-limiter>=0.2.0",
    "fastapi[standard]>=0.141.1",
    "passlib[argon2]>=1.7.4",
    "psycopg-binary>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.0",
    "redis>=5.2.0",
    "aio-pika>=9.5.0",
    "aiokafka>=0.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyjwt[cryptography]>=2.10.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-postgresql>=7.0.2",
    "ruff>=0.14.5",
    "taskipy>=1.14.1",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations', 'doc', '__pycache__', 'sketch', '.venv']

[tool.ruff.lint]
preview = true
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"schemas/__init__.py" = ["F403", "F405"]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end journeys spanning multiple endpoints (run with pytest -m integration)",
]

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/___python___/*",
    "app/main.py",
    "app/api/router.py",
    "app/core/lifespan.py",
    "app/core/logging.py",
    "app/core/observability.py",
    "app/core/redis.py",
    "app/api/routers/websockets.py",
    "app/api/websockets.py",
    "app/core/broker.py",
    "app/core/events.py",
    "app/schemas/notification.py",
    "app/services/notification_service.py",
]

[tool.coverage.report]
exclude_lines = ["def __repr__", "if __name__ == .__main__.:", "___python___"]

[tool.taskipy.tasks]
lint = 'ruff check'

pre_format = 'ruff check --fix'
format = 'ruff format'

run = 'fastapi dev app/main.py --host 0.0.0.0 --port 8000'
runserver = 'uvicorn app.main:app --host 0.0.0.0 --reload --port 8000'
seed = 'python -m app.db.init_db'

pre_test = 'task lint'
test = 'pytest -s -x --cov=app -vv'
test-dev = "pytest -p no:pytest_postgresql -s -x --cov=app -vv"
test-pg = "pytest -s -x --cov=app -vv"
post_test='coverage html'

html='open htmlcov/index.html'
